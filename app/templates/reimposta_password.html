{% extends "base.html" %}

{% block title %}Reimposta Password - ArmiMarket Italia{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">

    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-xl bg-amber-600/20 text-amber-500 border border-amber-500/30 flex items-center justify-center text-xl mx-auto shadow-lg shadow-amber-600/10">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-xl font-black tracking-tight text-white">Reimposta la Password</h1>
            <p class="text-xs text-slate-400">
                Scegli una nuova password sicura di almeno 8 caratteri per il tuo account.
            </p>
        </div>

        <div id="resetAlert" class="hidden p-4 rounded-xl text-xs font-semibold border"></div>

        <form id="resetForm" class="space-y-4" onsubmit="handleResetSubmit(event)">
            <!-- Token nascosto estratto dall'URL -->
            <input type="hidden" id="resetToken" value="{{ token }}">

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Nuova Password *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500 text-xs">
                        <i class="fa-solid fa-shield-halved"></i>
                    </span>
                    <input type="password" id="newPassword" required minlength="8" placeholder="Almeno 8 caratteri" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg pl-9 pr-3 py-2 text-xs focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Conferma Nuova Password *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500 text-xs">
                        <i class="fa-solid fa-check"></i>
                    </span>
                    <input type="password" id="confirmPassword" required minlength="8" placeholder="Ripeti la password" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg pl-9 pr-3 py-2 text-xs focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <button type="submit" id="btnSubmitReset" class="w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-black py-2.5 px-4 rounded-xl shadow-lg shadow-amber-600/20 transition-all flex items-center justify-center space-x-2">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Salva Nuova Password</span>
            </button>
        </form>

        <div class="text-center pt-3 border-t border-slate-800 text-xs text-slate-400">
            <a href="/login" class="text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Torna al Login
            </a>
        </div>

    </div>

</div>
{% endblock %}

{% block extra_scripts %}
<script nonce="{{ request.scope.get('csp_nonce', '') }}">
document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromUrl = urlParams.get("token");
    if (tokenFromUrl) {
        document.getElementById("resetToken").value = tokenFromUrl;
    }

    const currentToken = document.getElementById("resetToken").value;
    if (!currentToken) {
        const alertBox = document.getElementById("resetAlert");
        alertBox.className = "p-4 rounded-xl text-xs font-semibold border bg-rose-950/70 border-rose-600 text-rose-200 flex items-center space-x-2";
        alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-base"></i> <span>Token di sicurezza mancante. Richiedi un nuovo link di recupero.</span>`;
        alertBox.classList.remove("hidden");
        document.getElementById("btnSubmitReset").disabled = true;
    }
});

async function handleResetSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById("btnSubmitReset");
    const alertBox = document.getElementById("resetAlert");
    const token = document.getElementById("resetToken").value.trim();
    const pwd1 = document.getElementById("newPassword").value;
    const pwd2 = document.getElementById("confirmPassword").value;

    if (!token) {
        alert("Token di recupero mancante o non valido.");
        return;
    }

    if (pwd1 !== pwd2) {
        alertBox.className = "p-4 rounded-xl text-xs font-semibold border bg-rose-950/70 border-rose-600 text-rose-200 flex items-center space-x-2";
        alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-base"></i> <span>Le due password inserite non coincidono.</span>`;
        alertBox.classList.remove("hidden");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Aggiornamento password...`;

    try {
        const resp = await fetch("/api/v1/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                token: token,
                nuova_password: pwd1
            })
        });
        const data = await resp.json();

        alertBox.classList.remove("hidden");
        if (resp.ok) {
            alertBox.className = "p-4 rounded-xl text-xs font-semibold border bg-emerald-950/70 border-emerald-600 text-emerald-200 flex items-center space-x-2";
            const safeMsg = window.escapeHtml ? window.escapeHtml(data.message) : data.message;
            alertBox.innerHTML = `<i class="fa-solid fa-check-circle text-base"></i> <span>${safeMsg} Reindirizzamento al login...</span>`;
            document.getElementById("resetForm").reset();

            setTimeout(() => {
                window.location.href = "/login";
            }, 2000);
        } else {
            alertBox.className = "p-4 rounded-xl text-xs font-semibold border bg-rose-950/70 border-rose-600 text-rose-200 flex items-center space-x-2";
            const safeDetail = window.escapeHtml ? window.escapeHtml(data.detail || 'Impossibile reimpostare la password.') : (data.detail || 'Impossibile reimpostare la password.');
            alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-base"></i> <span>${safeDetail}</span>`;
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> <span>Salva Nuova Password</span>`;
        }
    } catch(err) {
        alertBox.classList.remove("hidden");
        alertBox.className = "p-4 rounded-xl text-xs font-semibold border bg-rose-950/70 border-rose-600 text-rose-200 flex items-center space-x-2";
        alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-base"></i> <span>Errore di connessione col server.</span>`;
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> <span>Salva Nuova Password</span>`;
    }
}
</script>
{% endblock %}
